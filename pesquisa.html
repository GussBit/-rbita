<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órbita | Gerador de Pesquisa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- Importando o CSS Global para garantir fontes e resets -->
    <link rel="stylesheet" href="/css/style.css">
    
    <script type="module" src="/js/pesquisa.js"></script>
</head>

<body>
    <div class="cursor-dot" data-cursor-dot></div>
    <div class="cursor-outline" data-cursor-outline></div>

    <nav class="orbit-nav">
        <div class="nav-container">
            <a href="index.html" class="logo">ÓRBITA<span class="dot">.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Voltar ao Início</a></li>
            </ul>
        </div>
    </nav>

    <section class="search-form-section">
        <div class="form-container">
            <div class="form-header">
                <span class="eyebrow-text">Ferramenta Interna</span>
                <h1 class="form-title">Nova <span class="highlight-serif">Pesquisa</span></h1>
            </div>
            
            <form id="researchForm" class="orbit-form">
                <div class="form-group">
                    <label for="title">Título da Pesquisa</label>
                    <input type="text" id="title" name="title" required placeholder="Ex: Tendências de UX para Saúde 2026">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Categoria</label>
                        <select id="category" name="category">
                            <option value="market">Mercado & Tendências</option>
                            <option value="ux-ui">UX / UI Design</option>
                            <option value="branding">Branding Médico</option>
                            <option value="tech">Tecnologia</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tags">Tags (separadas por vírgula)</label>
                        <input type="text" id="tags" name="tags" placeholder="Ex: design, mobile, conversão">
                    </div>
                </div>

                <div class="form-group">
                    <label for="content">Conteúdo / Insights</label>
                    <textarea id="content" name="content" rows="8" placeholder="Escreva os principais pontos da pesquisa aqui..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">
                        Gerar Arquivo MD
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
